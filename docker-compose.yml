services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dogs-vector-db

    environment:
      POSTGRES_DB: dogs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: